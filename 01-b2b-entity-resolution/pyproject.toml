[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "b2b-entity-resolution-engine"
version = "0.1.0"
description = "Production Entity Resolution & Record Linkage Engine for B2B Company Deduplication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.2.0",
    "networkx>=3.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
